# Standalone template. Replace {{...}} values, then add production TLS directives.
# Route /outpost/ only to riAuth. Do not put auth_request on that location.
daemon off;
master_process off;
pid {{RUNTIME}}/nginx.pid;
error_log {{RUNTIME}}/error.log;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path {{RUNTIME}}/body;
    proxy_temp_path {{RUNTIME}}/proxy;
    fastcgi_temp_path {{RUNTIME}}/fastcgi;
    uwsgi_temp_path {{RUNTIME}}/uwsgi;
    scgi_temp_path {{RUNTIME}}/scgi;
    map $http_upgrade $riauth_connection { default upgrade; '' close; }
    # Shared-domain SSO cookies can accompany same-site requests from sibling hosts.
    map $request_method $riauth_safe_method {
        default 0;
        GET 1;
        HEAD 1;
        OPTIONS 1;
    }
    map $http_origin $riauth_origin_allowed {
        default 0;
        "" 1;
        "{{ORIGIN}}" 1;
    }
    map $http_sec_fetch_site $riauth_site_allowed {
        default 0;
        "" 1;
        same-origin 1;
        none 1;
    }
    map "$riauth_safe_method$riauth_origin_allowed$riauth_site_allowed" $riauth_reject_write {
        default 1;
        ~^1 0;
        011 0;
    }
    server {
        listen {{LISTEN}};
        server_name {{SERVER_NAME}};
        location = /_riauth_auth {
            internal;
            proxy_pass {{ISSUER}}/outpost/{{CLIENT_ID}}/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL {{ORIGIN}}$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location /outpost/{{CLIENT_ID}}/ {
            proxy_pass {{ISSUER}}/outpost/{{CLIENT_ID}}/;
            proxy_set_header X-Original-URL {{ORIGIN}}$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / {
            if ($riauth_reject_write) { return 403; }
            auth_request /_riauth_auth;
            auth_request_set $riauth_login $upstream_http_x_riauth_login;
            auth_request_set $riauth_user $upstream_http_x_authentik_username;
            auth_request_set $riauth_uid $upstream_http_x_authentik_uid;
            auth_request_set $riauth_name $upstream_http_x_authentik_name;
            auth_request_set $riauth_email $upstream_http_x_authentik_email;
            auth_request_set $riauth_groups $upstream_http_x_authentik_groups;
            auth_request_set $riauth_cookie $upstream_http_x_riauth_app_cookie;
            error_page 401 = @riauth_login;
            proxy_set_header X-authentik-username $riauth_user;
            proxy_set_header X-authentik-uid $riauth_uid;
            proxy_set_header X-authentik-name $riauth_name;
            proxy_set_header X-authentik-email $riauth_email;
            proxy_set_header X-authentik-groups $riauth_groups;
            proxy_set_header X-authentik-entitlements "";
            proxy_set_header X-Auth-User $riauth_user;
            proxy_set_header X-Auth-Sub $riauth_uid;
            proxy_set_header Cookie $riauth_cookie;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host {{SERVER_NAME}};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $riauth_connection;
            proxy_pass {{UPSTREAM}};
        }
        location @riauth_login {
            internal;
            # Do not turn an unauthenticated write into a successful-looking GET.
            if ($request_method !~ ^(GET|HEAD)$) { return 401; }
            return 302 $riauth_login;
        }
    }
}
