scrape_configs:
  - job_name: riauth
    scheme: https
    metrics_path: /api/operations/prometheus
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/riauth_metrics_token
    static_configs:
      - targets: [identity.example.com:443]
rule_files:
  - /etc/prometheus/riauth-alerts.yml
