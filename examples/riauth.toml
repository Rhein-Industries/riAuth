# Generated by `riauth init`. The issuer must stay fixed after initialization.
issuer = "http://localhost:9000"
listen = "127.0.0.1:9000"
data_dir = "data"

# Durations in seconds.
access_token_ttl = 300
refresh_token_ttl = 2592000
session_ttl = 28800

# Recent passwords rejected on the next change. 0 disables checks. Maximum 24.
password_history = 5

# Optional record encryption. Generate with `riauth keygen --out database.key`
# before initialization. Use backup/restore to convert an existing plaintext DB.
# database_key_file = "database.key"

# Exact socket-peer IPs whose X-Forwarded-For chain may be trusted.
trusted_proxies = []
