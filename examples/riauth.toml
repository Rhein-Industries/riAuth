# Generated by `riauth init`. The issuer must stay fixed after initialization.
issuer = "http://localhost:9000"
listen = "127.0.0.1:9000"
data_dir = "data"

# Optional API-only mode. Browser pages and embedded assets are served by default.
# browser_ui = false

# Optional process role. Omit this table for the integrated one-process server:
# product HTTP, configured listeners, and background loops.
# gateway keeps product HTTP and configured listeners and does not start background loops.
# worker starts background loops, serves only /livez, /readyz, and /healthz,
# and requires browser_ui = false with no LDAP, RADIUS, or proxy listeners.
# gateway and worker require accept_partial_duties = true. riAuth does not
# check that any other process covers the omitted duties, and two processes
# still cannot open one redb file.
# [process]
# role = "gateway"
# accept_partial_duties = true

# Durations in seconds.
access_token_ttl = 300
refresh_token_ttl = 2592000
session_ttl = 28800

# Recent passwords rejected on the next change. 0 disables checks. Maximum 24.
password_history = 5

# Optional record encryption. Generate with `riauth keygen --out database.key`
# before initialization. Use backup/restore to convert an existing plaintext DB.
# database_key_file = "database.key"

# Exact socket-peer IPs whose X-Forwarded-For chain may be trusted.
trusted_proxies = []
