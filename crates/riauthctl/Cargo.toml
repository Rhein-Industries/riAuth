[package]
name = "riauthctl"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
description = "Standalone remote client for riAuth"
license = "MIT"
repository = "https://github.com/Rhein-Industries/riAuth"

# Keep the remote client outside the server package and its dependency graph.
[workspace]

[features]
default = []
terminal-usb = ["dep:webauthn-authenticator-rs", "dep:futures-util"]

[dependencies]
anyhow = "1"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
webauthn-authenticator-rs = { version = "=0.5.5", optional = true, features = ["usb", "ui-cli"] }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
