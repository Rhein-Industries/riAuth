name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: riauth-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 scripts/check-repo-hygiene.py
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake libssl-dev libudev-dev clang pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features test-support,fuzzing --locked -- -D warnings
      - run: cargo test --all-targets --features test-support,fuzzing --locked
      - name: Check server USB boundary
        run: |
          cargo build --no-default-features --features essentials --locked --bins
          cargo test --no-default-features --features essentials --locked --test cli legacy_usb_commands_fail_locally_with_client_guidance -- --exact
          python3 - <<'PY'
          import re, subprocess
          forbidden = {'webauthn-authenticator-rs', 'fido-hid-rs', 'hidapi',
                       'rusb', 'libusb1-sys', 'udev', 'libudev-sys'}
          for edition in ('essentials', 'platform'):
              tree = subprocess.check_output([
                  'cargo', 'tree', '--locked', '--no-default-features',
                  '--features', edition, '--target', 'x86_64-unknown-linux-gnu',
                  '--edges', 'normal', '--prefix', 'none', '--format', '{p}',
              ], text=True)
              packages = {match.group(1) for line in tree.splitlines()
                          if (match := re.match(r'^(\S+) v\S+', line))}
              leaked = sorted(packages & forbidden)
              if leaked:
                  raise SystemExit(f'{edition} server has terminal USB dependencies: {leaked}')
          PY
      - name: Check standalone riauthctl and its dependency closure
        run: |
          cargo fmt --manifest-path crates/riauthctl/Cargo.toml --all -- --check
          cargo test --manifest-path crates/riauthctl/Cargo.toml --no-default-features --all-targets --locked -- --test-threads=1
          cargo check --manifest-path crates/riauthctl/Cargo.toml --no-default-features --features terminal-usb --locked
          python3 - <<'PY'
          import pathlib, re, subprocess, tomllib
          tree = subprocess.check_output([
              'cargo', 'tree', '--manifest-path', 'crates/riauthctl/Cargo.toml',
              '--locked', '--no-default-features', '--target', 'x86_64-unknown-linux-gnu',
              '--edges', 'normal', '--prefix', 'none', '--format', '{p}',
          ], text=True)
          packages = {match.groups() for line in tree.splitlines()
                      if (match := re.match(r'^(\S+) v(\S+)', line))}
          forbidden = {'riauth', 'redb', 'postgres', 'tokio-postgres',
                       'webauthn-authenticator-rs', 'fido-hid-rs', 'hidapi',
                       'rusb', 'libusb1-sys', 'udev', 'libudev-sys'}
          leaked = sorted((name, version) for name, version in packages if name in forbidden)
          if leaked:
              raise SystemExit(f'riauthctl base build has server/store/USB dependencies: {leaked}')
          notices = {match.groups() for line in pathlib.Path('THIRD_PARTY_NOTICES.md').read_text().splitlines()
                     if (match := re.match(r'^\| (\S+) \| (\S+) \|', line))}
          client = tomllib.loads(pathlib.Path('crates/riauthctl/Cargo.toml').read_text())['package']
          if (client['name'], client['version']) not in packages:
              raise SystemExit('Could not parse riauthctl dependency tree')
          missing = sorted(packages - {(client['name'], client['version'])} - notices)
          if missing:
              raise SystemExit(f'riauthctl base dependencies missing from release notices: {missing}')
          PY
      - name: Check standalone client against the real server binaries
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --manifest-path crates/riauthctl/Cargo.toml --no-default-features --locked --bin riauthctl
          cargo test --features test-support --locked \
            --test m03_reviewed_grants_e2e --test m03_agent_e2e \
            --test m03_registration_e2e --test m03_windows_device_e2e \
            --test m03_pam_e2e --test m03_state_removal_e2e \
            --test m03_workflow_approval_e2e --test m03_backup_e2e \
            --test m03_connector_ldap_e2e \
            -- --ignored --test-threads=1
          cargo test --features test-support --locked --test m03_riauthctl_backends_postgres redb_backends -- --ignored --test-threads=1
      - name: Check documentation, notices, and delivery scripts
        run: |
          python3 scripts/check-docs.py
          python3 scripts/generate-third-party-notices.py --check
          python3 -m unittest discover -s tests -p 'test_installed_release_gate.py'
          python3 -m unittest discover -s tests -p 'test_run_conformance.py'
          python3 scripts/check-release-evidence.py
          python3 scripts/check-release-attestation.py static
          python3 -m unittest discover -s tests -p 'test_release_evidence.py'
          python3 -m unittest discover -s tests -p 'test_release_attestation.py'
          python3 -m unittest discover -s tests -p 'test_spdx_sbom.py'
          bash -n scripts/*.sh
      - run: cargo build --release --locked

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl cmake libssl-dev libudev-dev libpq-dev clang pkg-config \
            postgresql slapd ldap-utils nginx xmlsec1
      - name: Prepare Chrome for browser tests
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              --output "$RUNNER_TEMP/google-chrome.deb"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              "$RUNNER_TEMP/google-chrome.deb"
          fi
          mkdir -p "$RUNNER_TEMP/riauth-browser-bin"
          cat > "$RUNNER_TEMP/riauth-browser-bin/riauth-chrome" <<'SH'
          #!/usr/bin/env bash
          exec /usr/bin/google-chrome --no-sandbox --disable-dev-shm-usage "$@"
          SH
          chmod +x "$RUNNER_TEMP/riauth-browser-bin/riauth-chrome"
          printf '%s\n' "$RUNNER_TEMP/riauth-browser-bin" >> "$GITHUB_PATH"
      - name: Independent SAML XML signature and encryption
        run: RIAUTH_TEST_XMLSEC="$(command -v xmlsec1)" cargo test --test identity --locked saml_independent_xmlsec -- --ignored
      - name: Independent upstream SAML signatures
        run: RIAUTH_TEST_XMLSEC="$(command -v xmlsec1)" cargo test --test identity --locked saml_source_independent_xmlsec -- --ignored
      - name: Independent SAML logout
        run: RIAUTH_TEST_XMLSEC="$(command -v xmlsec1)" cargo test --test identity --locked saml_logout_independent_xmlsec -- --ignored
      - name: PostgreSQL replication and service failover
        run: PG_BIN="$(pg_config --bindir)" scripts/test-postgres.sh
      - name: Shared contracts on isolated PostgreSQL databases
        run: PG_BIN="$(pg_config --bindir)" bash scripts/test-contracts-postgres.sh
      - name: Secure first administrator setup in real browsers
        run: |
          cargo build --locked --bin riauth
          npm ci --prefix tools/browser
          cd tools/browser
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
          ./node_modules/.bin/playwright test setup.spec.js --reporter=list
      - name: Headless portal authenticator journeys
        timeout-minutes: 25
        run: |
          cargo build --locked --example portal_fixture
          cd tools/browser
          ./node_modules/.bin/playwright test \
            --project=chromium --project=firefox --project=webkit \
            --workers=1 --retries=0 \
            passkey-revocation.spec.js \
            authenticator-recovery.spec.js \
            passkey-rename.spec.js \
            password-reset-replay.spec.js \
            multi-authenticator.spec.js \
            invitation-passkey.spec.js \
            invitation-password.spec.js \
            invitation-passkey-shim.spec.js \
            --reporter=list
      - name: PostgreSQL Q05 replay and lease schedules
        run: PG_BIN="$(pg_config --bindir)" RIAUTH_PG_TEST_TARGET=q05_replay_concurrency scripts/test-postgres.sh
      - name: OpenLDAP synchronization and authentication
        run: scripts/test-ldap.sh
      - name: Real browser and relying party
        run: RIAUTH_TEST_BROWSER="$(command -v riauth-chrome)" cargo test --test browser --locked -- --ignored
      - name: Application portal browser checks
        run: RIAUTH_TEST_BROWSER="$(command -v riauth-chrome)" cargo test --test portal_browser --locked -- --ignored
      - name: nginx forward authentication and browser SSO
        run: RIAUTH_TEST_NGINX="$(command -v nginx)" RIAUTH_TEST_BROWSER="$(command -v riauth-chrome)" cargo test --test outpost --locked -- --ignored
      - name: Traefik forward authentication
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/traefik/traefik/releases/download/v3.7.13/traefik_v3.7.13_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/traefik.tgz"
          echo "52cd039a34258dd61c617a95d69252bc6bcae27c520f338186c31c7fef8f6394  $RUNNER_TEMP/traefik.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/traefik.tgz" -C "$RUNNER_TEMP" traefik
          RIAUTH_TEST_TRAEFIK="$RUNNER_TEMP/traefik" cargo test --test outpost_traefik --locked -- --ignored

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Install audit build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake libssl-dev clang pkg-config
      - name: Audit dependency advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2 --root "$RUNNER_TEMP/riauth-audit"
          "$RUNNER_TEMP/riauth-audit/bin/cargo-audit" audit
          "$RUNNER_TEMP/riauth-audit/bin/cargo-audit" audit --file fuzz/Cargo.lock
          "$RUNNER_TEMP/riauth-audit/bin/cargo-audit" audit --file crates/riauthctl/Cargo.lock
