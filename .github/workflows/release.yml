name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: riauth-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and current main commit
        run: |
          python3 scripts/release-version.py "$GITHUB_REF_NAME"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo 'Release tag must point to the current main commit' >&2
            exit 1
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RIAUTH_CI_IMAGE: riauth:release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake libssl-dev libudev-dev clang pkg-config
      - name: Build, smoke test, and package the checked tag
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          RIAUTH_COMMIT="$(git rev-parse HEAD)"
          export RIAUTH_COMMIT
          test "$(uname -m)" = x86_64
          python3 scripts/generate-third-party-notices.py --check
          cargo build --release --locked
          docker build -t "$RIAUTH_CI_IMAGE" .
          docker run --rm "$RIAUTH_CI_IMAGE" --json capabilities
          docker run --rm --entrypoint cat "$RIAUTH_CI_IMAGE" /usr/share/doc/riauth/THIRD_PARTY_NOTICES.md | cmp - THIRD_PARTY_NOTICES.md
          docker run --rm --entrypoint test "$RIAUTH_CI_IMAGE" -r /usr/share/doc/libssl3/copyright
          docker run --rm --entrypoint test "$RIAUTH_CI_IMAGE" -r /usr/share/doc/libudev1/copyright
          scripts/package-release.sh
          cd target/dist
          sha256sum --check SHA256SUMS
          tar -xOzf riauth-linux-x86_64.tar.gz LICENSE | cmp - ../../LICENSE
          tar -xOzf riauth-linux-x86_64.tar.gz THIRD_PARTY_NOTICES.md | cmp - ../../THIRD_PARTY_NOTICES.md
      - name: Create a draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/dist/* --verify-tag --draft --title "riAuth $GITHUB_REF_NAME" --notes-file docs/release-notes.md
