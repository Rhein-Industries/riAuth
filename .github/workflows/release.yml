name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: riauth-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and current main commit
        run: |
          python3 scripts/release-version.py "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import pathlib, tomllib
          server = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          client = tomllib.loads(pathlib.Path('crates/riauthctl/Cargo.toml').read_text())['package']['version']
          if client != server:
              raise SystemExit(f'riauthctl version {client} differs from release version {server}')
          PY
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo 'Release tag must point to the current main commit' >&2
            exit 1
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RIAUTH_ESSENTIALS_IMAGE: riauth:essentials-${{ github.run_id }}-${{ github.run_attempt }}
      RIAUTH_PLATFORM_IMAGE: riauth:platform-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake libssl-dev clang pkg-config
      - name: Build, smoke test, and package the checked tag
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          RIAUTH_COMMIT="$(git rev-parse HEAD)"
          export RIAUTH_COMMIT
          test "$(uname -m)" = x86_64
          python3 scripts/generate-third-party-notices.py --check
          cargo build --release --locked --no-default-features --features essentials --bins --target-dir target/essentials
          cargo build --release --locked --no-default-features --features platform --bins --target-dir target/platform
          cargo build --manifest-path crates/riauthctl/Cargo.toml --release --locked --no-default-features
          crates/riauthctl/target/release/riauthctl --version
          docker build --build-arg RIAUTH_EDITION=essentials -t "$RIAUTH_ESSENTIALS_IMAGE" .
          docker build --build-arg RIAUTH_EDITION=platform -t "$RIAUTH_PLATFORM_IMAGE" .
          for edition in essentials platform; do
            if [ "$edition" = essentials ]; then image="$RIAUTH_ESSENTIALS_IMAGE"; else image="$RIAUTH_PLATFORM_IMAGE"; fi
            docker run --rm "$image" --json capabilities | python3 -c 'import json,sys; expected=sys.argv[1]; result=json.load(sys.stdin); assert result["ok"] and result["data"]["edition"] == expected' "$edition"
            docker run --rm --entrypoint cat "$image" /usr/share/doc/riauth/THIRD_PARTY_NOTICES.md | cmp - THIRD_PARTY_NOTICES.md
            docker run --rm --entrypoint test "$image" -r /usr/share/doc/libssl3t64/copyright
          done
          scripts/package-release.sh
          docker image rm "$RIAUTH_ESSENTIALS_IMAGE" "$RIAUTH_PLATFORM_IMAGE"
          docker load --input target/dist/riauth-essentials-linux-x86_64.docker.tar.gz
          docker load --input target/dist/riauth-platform-linux-x86_64.docker.tar.gz
          python3 scripts/check-edition-artifacts.py \
            --essentials-archive target/dist/riauth-essentials-linux-x86_64.tar.gz \
            --platform-archive target/dist/riauth-platform-linux-x86_64.tar.gz \
            --essentials-image "$RIAUTH_ESSENTIALS_IMAGE" \
            --platform-image "$RIAUTH_PLATFORM_IMAGE"
          cd target/dist
          sha256sum --check SHA256SUMS
          for edition in essentials platform; do
            tar -xOzf "riauth-$edition-linux-x86_64.tar.gz" LICENSE | cmp - ../../LICENSE
            tar -xOzf "riauth-$edition-linux-x86_64.tar.gz" THIRD_PARTY_NOTICES.md | cmp - ../../THIRD_PARTY_NOTICES.md
          done
          tar -xOzf riauthctl-linux-x86_64.tar.gz LICENSE | cmp - ../../LICENSE
          tar -xOzf riauthctl-linux-x86_64.tar.gz THIRD_PARTY_NOTICES.md | cmp - ../../THIRD_PARTY_NOTICES.md
      - name: Create a draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/dist/* --verify-tag --draft --title "riAuth $GITHUB_REF_NAME" --notes-file docs/release-notes.md
