name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: riauth-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and current main commit
        run: |
          python3 scripts/release-version.py "$GITHUB_REF_NAME"
          python3 - <<'PY'
          import pathlib, tomllib
          server = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          client = tomllib.loads(pathlib.Path('crates/riauthctl/Cargo.toml').read_text())['package']['version']
          if client != server:
              raise SystemExit(f'riauthctl version {client} differs from release version {server}')
          PY
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo 'Release tag must point to the current main commit' >&2
            exit 1
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RIAUTH_ARCH: ${{ matrix.arch }}
      RIAUTH_ESSENTIALS_IMAGE: riauth:essentials-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      RIAUTH_PLATFORM_IMAGE: riauth:platform-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake libssl-dev clang pkg-config
      - name: Build, smoke test, and package the checked tag
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          RIAUTH_COMMIT="$(git rev-parse HEAD)"
          export RIAUTH_COMMIT
          test "$(uname -m)" = "$RIAUTH_ARCH"
          python3 scripts/generate-third-party-notices.py --check
          cargo build --release --locked --no-default-features --features essentials --bins --target "${{ matrix.target }}" --target-dir target/essentials
          cargo build --release --locked --no-default-features --features platform --bins --target "${{ matrix.target }}" --target-dir target/platform
          cargo build --manifest-path crates/riauthctl/Cargo.toml --release --locked --no-default-features --target "${{ matrix.target }}"
          crates/riauthctl/target/${{ matrix.target }}/release/riauthctl --version
          docker build --platform "${{ matrix.platform }}" --build-arg RIAUTH_EDITION=essentials --build-arg RIAUTH_COMMIT="$RIAUTH_COMMIT" -t "$RIAUTH_ESSENTIALS_IMAGE" .
          docker build --platform "${{ matrix.platform }}" --build-arg RIAUTH_EDITION=platform --build-arg RIAUTH_COMMIT="$RIAUTH_COMMIT" -t "$RIAUTH_PLATFORM_IMAGE" .
          for edition in essentials platform; do
            if [ "$edition" = essentials ]; then image="$RIAUTH_ESSENTIALS_IMAGE"; else image="$RIAUTH_PLATFORM_IMAGE"; fi
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "${{ matrix.platform }}"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RIAUTH_COMMIT"
            docker run --rm --platform "${{ matrix.platform }}" "$image" --json capabilities | python3 -c 'import json,sys; expected=sys.argv[1]; result=json.load(sys.stdin); assert result["ok"] and result["data"]["edition"] == expected' "$edition"
            docker run --rm --entrypoint cat "$image" /usr/share/doc/riauth/THIRD_PARTY_NOTICES.md | cmp - THIRD_PARTY_NOTICES.md
            docker run --rm --entrypoint test "$image" -r /usr/share/doc/libssl3t64/copyright
          done
          scripts/package-release.sh
          docker image rm "$RIAUTH_ESSENTIALS_IMAGE" "$RIAUTH_PLATFORM_IMAGE"
          docker load --input "target/dist/riauth-essentials-linux-$RIAUTH_ARCH.docker.tar.gz"
          docker load --input "target/dist/riauth-platform-linux-$RIAUTH_ARCH.docker.tar.gz"
          python3 scripts/check-edition-artifacts.py \
            --essentials-archive "target/dist/riauth-essentials-linux-$RIAUTH_ARCH.tar.gz" \
            --platform-archive "target/dist/riauth-platform-linux-$RIAUTH_ARCH.tar.gz" \
            --essentials-maintenance-archive "target/dist/riauth-maintenance-essentials-linux-$RIAUTH_ARCH.tar.gz" \
            --platform-maintenance-archive "target/dist/riauth-maintenance-platform-linux-$RIAUTH_ARCH.tar.gz" \
            --riauthctl-archive "target/dist/riauthctl-linux-$RIAUTH_ARCH.tar.gz" \
            --essentials-image "$RIAUTH_ESSENTIALS_IMAGE" \
            --platform-image "$RIAUTH_PLATFORM_IMAGE"
          for edition in essentials platform; do
            tar -xOzf "target/dist/riauth-maintenance-$edition-linux-$RIAUTH_ARCH.tar.gz" riauth-maintenance | cmp - "target/$edition/${{ matrix.target }}/release/riauth-maintenance"
          done
          cd target/dist
          sha256sum --check "SHA256SUMS-linux-$RIAUTH_ARCH"
          for archive in "riauth-essentials-linux-$RIAUTH_ARCH.tar.gz" "riauth-platform-linux-$RIAUTH_ARCH.tar.gz" "riauth-maintenance-essentials-linux-$RIAUTH_ARCH.tar.gz" "riauth-maintenance-platform-linux-$RIAUTH_ARCH.tar.gz" "riauthctl-linux-$RIAUTH_ARCH.tar.gz"; do
            tar -xOzf "$archive" LICENSE | cmp - ../../LICENSE
            tar -xOzf "$archive" THIRD_PARTY_NOTICES.md | cmp - ../../THIRD_PARTY_NOTICES.md
          done
          python3 ../../scripts/check-installed-release-gate.py . "$RIAUTH_COMMIT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Record exact subject digests
        run: |
          dist=target/dist
          arch="$RIAUTH_ARCH"
          tmp="${RUNNER_TEMP}/riauth-subjects"
          mkdir -p "$tmp"
          (
            cd "$dist"
            sha256sum -- * > "$tmp/all-subjects.txt"
            sha256sum -- \
              "riauth-essentials-linux-$arch.tar.gz" \
              "riauth-maintenance-essentials-linux-$arch.tar.gz" \
              "riauth-essentials-linux-$arch.docker.tar.gz" \
              > "$tmp/essentials-subjects.txt"
            sha256sum -- \
              "riauth-platform-linux-$arch.tar.gz" \
              "riauth-maintenance-platform-linux-$arch.tar.gz" \
              "riauth-platform-linux-$arch.docker.tar.gz" \
              > "$tmp/platform-subjects.txt"
            sha256sum -- "riauthctl-linux-$arch.tar.gz" > "$tmp/riauthctl-subjects.txt"
          )
      - name: Attest packaged file provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/riauth-subjects/all-subjects.txt
      - name: Attest Essentials package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/riauth-subjects/essentials-subjects.txt
          sbom-path: target/dist/riauth-essentials-linux-${{ matrix.arch }}.spdx.json
      - name: Attest Platform package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/riauth-subjects/platform-subjects.txt
          sbom-path: target/dist/riauth-platform-linux-${{ matrix.arch }}.spdx.json
      - name: Attest riauthctl package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/riauth-subjects/riauthctl-subjects.txt
          sbom-path: target/dist/riauthctl-linux-${{ matrix.arch }}.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riauth-linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: riauth-linux-*
          path: target/dist
          merge-multiple: true
      - name: Verify the complete two-architecture release bundle
        run: python3 scripts/check-release-bundle.py target/dist "$(git rev-parse HEAD)" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Create a draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/dist/* --verify-tag --draft --title "riAuth $GITHUB_REF_NAME" --notes-file docs/release-notes.md
