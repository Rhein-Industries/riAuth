<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="riauth-base" content="__BASE__">
  <title>Complete your account · riAuth</title>
  <script src="__BASE__portal/assets/appearance.js"></script>
  <link rel="stylesheet" href="__BASE__portal/assets/app.css">
  <script src="__BASE__portal/assets/auth.js" defer></script>
  <script src="__BASE__portal/assets/capabilities.js" defer></script>
  <script src="__BASE__portal/assets/account.js" defer></script>
</head>
<body>
<main class="standalone">
  <section class="auth-panel signin-shell" aria-labelledby="account-title">
    <div class="signin-brand"><img class="brand-mark" src="__BASE__portal/assets/riauth-mark.svg" alt="" aria-hidden="true"><p class="eyebrow">RIAUTH</p></div>
    <h1 id="account-title" tabindex="-1">Complete your account</h1>
    <p id="account-description">Checking your email link…</p>
    <p id="account-error" class="form-error" role="alert" tabindex="-1" hidden></p>
    <form id="account-form" novalidate hidden>
      <div class="field" id="account-username-field" hidden><label for="account-username">Username</label><input id="account-username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64"></div>
      <div id="account-password-fields" hidden>
        <div class="field"><label for="account-password">New password</label><input id="account-password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" aria-describedby="account-password-hint"><p id="account-password-hint" class="field-hint">Use at least 12 characters. Your organization may require a stronger password.</p></div>
        <div class="field"><label for="account-confirm">Confirm new password</label><input id="account-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024"></div>
      </div>
      <p id="account-note" class="field-hint" hidden></p>
      <button id="account-submit" class="button primary" type="submit">Continue</button>
    </form>
    <form id="account-passkey-form" data-capability="identity.passkeys" hidden aria-labelledby="account-passkey-title">
      <h2 id="account-passkey-title">Add a passkey</h2>
      <p id="account-passkey-hint" class="field-hint">Name this passkey. You sign in with it afterwards. This page does not sign you in.</p>
      <div class="field"><label for="account-passkey-name">Passkey name</label><input id="account-passkey-name" autocomplete="off" maxlength="200" spellcheck="false" aria-describedby="account-passkey-hint"></div>
      <button id="account-passkey-submit" class="button secondary" type="submit">Accept with a passkey</button>
    </form>
    <section id="account-complete" hidden aria-live="polite" tabindex="-1">
      <h2 id="account-complete-title"></h2>
      <p id="account-complete-text"></p>
      <a id="account-complete-link" class="button primary" data-capability="portal.user_applications" href="__BASE__apps">Continue to sign in</a>
    </section>
    <p id="account-fallback" hidden><a data-capability="portal.user_applications" href="__BASE__apps">Open applications</a></p>
    <noscript><p>Enable JavaScript to use this page. Opening an email link does not use it; you must confirm on this page.</p></noscript>
  </section>
</main>
</body>
</html>
