<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="riauth-base" content="__BASE__">
  <title>Temporary access review · riAuth</title>
  <link rel="stylesheet" href="__BASE__portal/assets/app.css">
  <link rel="stylesheet" href="__BASE__portal/assets/access-review.css">
  <script src="__BASE__portal/assets/access-review.js" defer></script>
</head>
<body class="access-review">
  <a class="skip-link" href="#main">Skip to access review</a>
  <main id="main" tabindex="-1">
    <nav aria-label="Workspace"><a href="__BASE__apps">Your applications</a></nav>
    <header class="review-heading">
      <div><p class="eyebrow">TEMPORARY ACCESS</p><h1>Access review</h1><p>Decide requests for the groups you are configured to approve, or revoke current temporary access.</p></div>
      <button id="refresh" class="button secondary" type="button">Refresh</button>
    </header>
    <p id="identity" class="review-identity"></p>
    <p id="status" class="notice" role="alert" tabindex="-1" hidden></p>
    <div id="retry" class="review-retry" hidden><button id="retry-action" class="button primary" type="button">Retry the same action</button><button id="inspect" class="button secondary" type="button">Inspect current state</button></div>
    <section aria-labelledby="requests-title">
      <h2 id="requests-title">Requests awaiting your decision</h2>
      <div id="requests" class="review-list"></div>
    </section>
    <section aria-labelledby="grants-title">
      <h2 id="grants-title">Active temporary access you may revoke</h2>
      <div id="grants" class="review-list"></div>
    </section>
    <noscript><p>JavaScript is needed to review temporary access. You can use the HTTP API or CLI instead.</p></noscript>
  </main>
</body>
</html>
