[package]
name = "riauth-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
riauth = { path = "..", features = ["fuzzing"] }
